<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Uzuza</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #f7f4ee;
        color: #1a5f4a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wrap { text-align: center; }
      h1 { font-size: 1.25rem; font-weight: 700; margin: 0 0 0.5rem; }
      p { font-size: 0.875rem; color: #1a5f4a99; margin: 0; }
    </style>
  </head>
  <body>
    <!--
      Local fallback shell only. This app runs with server.url set in
      capacitor.config.ts, so the native app loads the live deployed site
      directly on every normal launch — this file only ever renders if
      that load hasn't completed yet, or there's no network at all. It is
      NOT a bundled copy of the app; Uzuza's App Router (server components,
      API routes) can't be statically exported, so wrapping the live URL
      is the correct approach here, not a workaround.
    -->
    <div class="wrap">
      <h1>Uzuza</h1>
      <p>Loading&hellip;</p>
    </div>
  </body>
</html>
