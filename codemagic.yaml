workflows:
  android-debug:
    name: Uzuza Android Debug Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 20
      java: 21
      vars:
        # Nothing secret needed for a debug build - it loads the live
        # deployed site (capacitor.config.ts's server.url), it doesn't
        # bundle any env-dependent build output itself.
        PACKAGE_NAME: "com.uzuza.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync Capacitor config into the native Android project
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.apk
